name: Portable private IPC diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-office-measurement:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, xcode-27]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Record actual platform
        run: |
          uname -m
          sw_vers -productVersion
          sysctl -n machdep.cpu.brand_string
          xcodebuild -version
      - name: Verify owned process lifecycle before conversion
        run: python3 -m unittest discover -s diagnostics -p test_portable_office_diagnostics.py -v
      - name: Verify real private IPC worker and report controls
        run: |
          python3 -m unittest discover -s diagnostics -p test_private_ipc_worker.py -v
          python3 -m unittest discover -s diagnostics -p test_private_ipc_diagnostics.py -v
      - name: Compile IPC controls before downloading the converter
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/PDF-office-probe-build"
          xcrun clang -arch arm64 -Wall -Wextra -Werror diagnostics/PortableIPCProbe.c -o "$RUNNER_TEMP/PDF-office-probe-build/probe" 2>&1 | tee "$RUNNER_TEMP/PDF-office-probe-build/compile.log"
      - name: Prepare pinned converter and private Python and Chromium fixtures
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          brew install --cask libreoffice
          brew install python@3.12 ca-certificates
          /opt/homebrew/opt/python@3.12/bin/python3.12 -m venv "$RUNNER_TEMP/pdf-office-diagnostic-tools"
          "$RUNNER_TEMP/pdf-office-diagnostic-tools/bin/python3" -m pip install --report "$RUNNER_TEMP/PDF-office-probe-build/pip-install.json" PyMuPDF==1.26.5 python-docx==1.2.0 lxml==6.1.3 typing_extensions==4.16.0 playwright==1.56.0 greenlet==3.5.6 pyee==13.0.1
          PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/pdf-ipc-source-browsers" "$RUNNER_TEMP/pdf-office-diagnostic-tools/bin/python3" -m playwright install chromium
      - name: Measure exact Office causality and private Unix IPC boundaries
        run: |
          "$RUNNER_TEMP/pdf-office-diagnostic-tools/bin/python3" diagnostics/portable_office_diagnostics.py --output "$RUNNER_TEMP/PDF-office-diagnostics" --ipc-probe "$RUNNER_TEMP/PDF-office-probe-build/probe" --private-ipc --source-venv "$RUNNER_TEMP/pdf-office-diagnostic-tools" --source-browsers "$RUNNER_TEMP/pdf-ipc-source-browsers"
      - name: Retain synthetic diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PDF-office-diagnostics-${{ matrix.runner }}
          path: |
            ${{ runner.temp }}/PDF-office-diagnostics/
            ${{ runner.temp }}/PDF-office-probe-build/
          if-no-files-found: warn
          retention-days: 7
