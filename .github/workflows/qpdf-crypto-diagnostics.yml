name: Relocated qpdf crypto diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-crypto-measurement:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, xcode-27]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Record actual platform
        run: |
          uname -m
          sw_vers -productVersion
          sysctl -n machdep.cpu.brand_string
          xcodebuild -version
      - name: Validate diagnostic receipt and redaction controls
        run: python3 -m unittest discover -s diagnostics -p test_qpdf_crypto_diagnostics.py -v
      - name: Compile independent PDFKit fixture
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/PDF-qpdf-crypto-build"
          xcrun swiftc -parse-as-library -target arm64-apple-macos26.0 diagnostics/QPDFCryptoFixture.swift -o "$RUNNER_TEMP/PDF-qpdf-crypto-build/fixture" 2>&1 | tee "$RUNNER_TEMP/PDF-qpdf-crypto-build/compile.log"
      - name: Prepare the same qpdf dependency closure
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: brew install qpdf ca-certificates
      - name: Measure crypto discovery without changing the product
        run: python3 diagnostics/qpdf_crypto_diagnostics.py --fixture "$RUNNER_TEMP/PDF-qpdf-crypto-build/fixture" --output "$RUNNER_TEMP/PDF-qpdf-crypto"
      - name: Retain synthetic diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PDF-qpdf-crypto-${{ matrix.runner }}
          path: |
            ${{ runner.temp }}/PDF-qpdf-crypto/
            ${{ runner.temp }}/PDF-qpdf-crypto-build/
          if-no-files-found: warn
          retention-days: 7
